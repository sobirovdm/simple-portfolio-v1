<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <h1 class="header__title">Welcome to My Personal Webpage</h1>

        <!-- NAVIGATION MENU -->
        <nav class="navbar">
            <ul class="navbar__list">
                <li class="navbar__item"><a href="#about-me" class="navbar__link">About Me</a></li>
                <li class="navbar__item"><a href="#projects" class="navbar__link">Projects</a></li>
                <li class="navbar__item"><a href="#contact" class="navbar__link">Contact</a></li>
            </ul>
        </nav>
        <!-- /NAVIGATION MENU -->
    </header>
    <!-- /HEADER -->
    
    <!-- MAIN CONTENT -->
    <main class="main-content">
        <!-- ABOUT ME SECTION -->
        <section id="about-me" class="about-me">
            <h2 class="about-me__title">About Me</h2>
            <p class="about-me__text">Hello! I am a web developer with a passion for developing beautiful and functional website.</p>
        </section>
        <!-- /ABOUT ME SECTION -->
        
        <!-- PROJECTS SECTION -->
        <section id="projects" class="projects">
            <h2 class="projects__title">Projects</h2>
            <ul class="projects__list">
                <li class="projects__item">Project 1: <a href="#" class="projects__link">Link to project</a></li>
                <li class="projects__item">Project 2: <a href="#" class="projects__link">Link to project</a></li>
            </ul>
        </section>
        <!-- /PROJECTS SECTION -->
        
        <!-- CONTACT SECTION -->
        <section id="contact" class="contact">
            <h2 class="contact__title">Contact</h2>
            
            <form action="#" class="contact__form">
                <label for="name" class="input-label">Name:</label>
                <input type="text" id="name" class="form-input" name="name" required>
                
                <label for="email" class="input-label">Email:</label>
                <input type="email" id="email" class="form-input" name="email" required>
                
                <label for="message" class="textarea-label">Message:</label>
                <textarea name="message" id="message" class="form-textarea"></textarea>
                
                <button class="form-btn" type="submit" name="action" value="save">Submit</button>
            </form>
        </section>
        <!-- /CONTACT SECTION -->
    </main>
    <!-- /MAIN CONTENT -->
    
    <!-- FOOTER -->
    <footer class="footer">
        <p class="footer__text">&copy;&nbsp;2026&nbsp;My&nbsp;Personal&nbsp;Webpage</p>
    </footer>
    <!-- /FOOTER -->
</body>
</html>
